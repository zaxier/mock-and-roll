[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my_retail_demo"
version = "1.0.0"
description = "Synthetic data pipeline for Databricks"
requires-python = ">=3.12"
dependencies = [
    "databricks-connect>=16.4.0",
    "mimesis>=18.0.0",
    "pandas>=2.2.3",
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/my_retail_demo"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
